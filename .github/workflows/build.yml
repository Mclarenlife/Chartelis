name: Build Chartelis
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            artifact: windows
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm desktop:build ${{ matrix.args }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Verify macOS application bundle
        if: runner.os == 'macOS'
        run: python3 scripts/verify-macos-bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chartelis-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
