name: Build Chartelis
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            artifact: windows
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm desktop:build ${{ matrix.args }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Verify macOS application bundle
        if: runner.os == 'macOS'
        run: python3 scripts/verify-macos-bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chartelis-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Chartelis-*
          path: downloaded
          merge-multiple: true
      - name: Verify version and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
          test -f "release-notes/$RELEASE_TAG.md"
          mkdir packages
          find downloaded -type f \( -name '*.exe' -o -name '*.dmg' \) -exec cp {} packages/ \;
          test -s "packages/Chartelis_${VERSION}_x64-setup.exe"
          test -s "packages/Chartelis_${VERSION}_universal.dmg"
          test "$(find packages -type f | wc -l)" -eq 2
          (cd packages && sha256sum *.exe *.dmg > SHA256SUMS.txt)
      - name: Publish both installers together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" packages/* --clobber
          else
            gh release create "$RELEASE_TAG" packages/* --draft --prerelease --verify-tag \
              --title "Chartelis $RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
